version: "3.9"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      ENVIRONMENT: production
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 10
      WHATSAPP_API_URL: http://whatsapp-api:3000
      WHATSAPP_API_KEY: maia-secret-key
    volumes:
      - uploads_data:/app/uploads
    networks:
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bmsfront.rule=Host(`ali-axis.maia.com.my`)"
      - "traefik.http.routers.bmsfront.entrypoints=websecure"
      - "traefik.http.routers.bmsfront.tls.certresolver=letsencrypt"
      - "traefik.http.services.bmsfront.loadbalancer.server.port=3000"

  whatsapp-api:
    image: devlikeapro/waha
    restart: unless-stopped
    environment:
      WHATSAPP_API_KEY: maia-secret-key
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    volumes:
      - whatsapp_data:/app/.sessions
    networks:
      - dokploy-network

volumes:
  uploads_data:
  whatsapp_data:

networks:
  dokploy-network:
    external: true
